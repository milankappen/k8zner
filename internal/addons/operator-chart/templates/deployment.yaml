apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8zner-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8zner-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8zner-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "k8zner-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8zner-operator.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.healthProbe.port }}
            - --log-level={{ .Values.logLevel }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect=true
            - --leader-election-id={{ .Values.leaderElection.resourceName }}
            {{- else }}
            - --leader-elect=false
            {{- end }}
          env:
            # The token is mounted as a file rather than injected as an env var
            # so it never shows up in `kubectl describe pod` or env dumps.
            - name: HCLOUD_TOKEN_FILE
              value: /var/run/secrets/k8zner/{{ .Values.credentials.existingSecretKey }}
            {{- if .Values.hostNetwork }}
            - name: KUBERNETES_SERVICE_HOST
              value: "localhost"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthProbe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: credentials
              mountPath: /var/run/secrets/k8zner
              readOnly: true
            - name: helm-cache
              mountPath: /home/nonroot/.cache
            - name: helm-config
              mountPath: /home/nonroot/.config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: {{ include "k8zner-operator.credentialsSecretName" . }}
            defaultMode: 288 # 0440 in decimal; YAML 1.2 parsers read 0440 as decimal 440
        - name: helm-cache
          emptyDir: {}
        - name: helm-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
