# Default values for k8zner-operator

replicaCount: 2

image:
  repository: ghcr.io/milankappen/k8zner-operator
  pullPolicy: Always  # Always pull to ensure latest image is used
  tag: ""  # Defaults to chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Leader election settings
leaderElection:
  enabled: true
  resourceName: k8zner-operator

# Credentials (required)
credentials:
  # Hetzner Cloud API token
  hcloudToken: ""
  # Reference to existing secret (alternative to hcloudToken)
  existingSecret: ""
  existingSecretKey: "hcloud-token"

# Pod configuration
podAnnotations: {}
podLabels: {}

# Priority class for the operator pods. The operator self-heals the cluster it
# runs on, so consider "system-cluster-critical" to protect it from eviction
# under node pressure. Empty means no priority class.
priorityClassName: ""

# Keep at least one operator replica available during voluntary disruptions
# (node drains, upgrades). Only rendered when replicaCount > 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  # Group-own mounted volumes (the credentials secret) so the nonroot user
  # can read them with a restrictive file mode.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Run on control plane nodes with tolerations
nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  # Tolerate uninitialized taint so operator can run before CCM initializes the node
  - key: node.cloudprovider.kubernetes.io/uninitialized
    operator: Exists
    effect: NoSchedule
  # Tolerate not-ready taint so operator can run before CNI makes node ready
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoSchedule
  # Tolerate Cilium agent not-ready taint so operator can run before CNI is installed
  # The operator installs Cilium, so it must be schedulable without Cilium running
  - key: node.cilium.io/agent-not-ready
    operator: Exists
    effect: NoSchedule

# Spread across control plane nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: k8zner-operator
          topologyKey: kubernetes.io/hostname

# Metrics and health probes
metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

healthProbe:
  port: 8081

# NetworkPolicy restricting the operator pod to the traffic it needs.
# Not rendered when hostNetwork is enabled, because NetworkPolicies do not
# apply to hostNetwork pods.
networkPolicy:
  enabled: true

# Log level (debug, info, error)
logLevel: info
